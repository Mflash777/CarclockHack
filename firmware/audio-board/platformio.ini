; HackClock v2 - AUDIO board (classic ESP32 with PSRAM, e.g. ESP32-DevKitC-VE / WROVER-E)
; Bluetooth A2DP speaker + plays Home Assistant voice replies + alarm tones + TFT backlight.
; The ESP32-S3 on the clock board has no Bluetooth Classic, which is why this board exists.

[env:audio]
platform = espressif32@6.9.0
board = esp-wrover-kit            ; any ESP32-WROVER board works; change if yours needs it
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv   ; Bluetooth Classic + WiFi + MP3 decoder are big
lib_deps =
    https://github.com/pschatzmann/arduino-audio-tools.git
    https://github.com/pschatzmann/ESP32-A2DP.git
    https://github.com/pschatzmann/arduino-libhelix.git
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=1
