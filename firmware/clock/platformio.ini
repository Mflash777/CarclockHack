; HackClock v2 - CLOCK board (XIAO ESP32-S3): displays, buttons, mic/voice, WiFi data
; Build:  pio run          Upload:  pio run -t upload        Serial: pio device monitor

[env:xiao_esp32s3]
platform = espressif32@6.9.0          ; Arduino-ESP32 core 2.0.x (TFT_eSPI is happiest here)
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv  ; WiFi + HTTPS + fonts need the room
board_build.arduino.memory_type = qio_opi   ; XIAO ESP32-S3 has 8 MB octal PSRAM

lib_deps =
    bodmer/TFT_eSPI@2.5.43
    adafruit/Adafruit LED Backpack Library@^1.5.1
    links2004/WebSockets@^2.4.1
    adafruit/RTClib@^2.1.4
    bblanchon/ArduinoJson@^7.2.0
    tzapu/WiFiManager@^2.0.17

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    ; ---------- TFT_eSPI setup (no need to edit the library's User_Setup.h) ----------
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1             ; 2.0" 240x320 IPS. For an ILI9341 2.4" use -DILI9341_DRIVER=1 instead
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_INVERSION_ON=1          ; IPS ST7789 panels need this. Colours look negative? change to TFT_INVERSION_OFF
    -DTFT_MISO=-1
    -DTFT_MOSI=9                  ; XIAO D10
    -DTFT_SCLK=7                  ; XIAO D8
    -DTFT_CS=3                    ; XIAO D2
    -DTFT_DC=2                    ; XIAO D1
    -DTFT_RST=-1                  ; RC reset on the PCB, software reset in the driver
    -DUSE_HSPI_PORT=1             ; avoids a known ESP32-S3 crash with TFT_eSPI
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000
